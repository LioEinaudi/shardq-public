name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    # setup-python provides CPython 3.9 builds for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps .
      - run: shardq --help
      - run: python -m unittest discover -s tests -v
